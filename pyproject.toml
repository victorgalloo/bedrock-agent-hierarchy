[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bedrock-agent-hierarchy"
version = "0.0.1"
description = "Manager -> sub-agent hierarchies on Amazon Bedrock: org chart as data, one-level escalation, reversible changes."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Omona" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = ["pydantic>=2.6", "PyYAML>=6.0"]

[project.optional-dependencies]
bedrock = ["boto3>=1.35"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://omona.tech/open-source"
Repository = "https://github.com/victorgalloo/bedrock-agent-hierarchy"

[tool.hatch.build.targets.wheel]
packages = ["agent_hierarchy"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
